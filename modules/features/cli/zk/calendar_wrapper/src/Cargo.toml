[package]
name = "zk-calendar-picker"
version = "0.1.0"
edition = "2024"
description = "Interactive calendar picker for zk daily notes"
rust-version = "1.88"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["widget-calendar"] }
serde = { version = "1.0", features = ["derive"] }
time = "0.3"
serde_json = "1.0.151"
libc = "0.2"
nix = { version = "0.31", features = ["fs"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
