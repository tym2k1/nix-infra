[weather]
enabled = false

[widget.battery]
display_mode = "graphic"

    [widget.battery.actions]
    middle = "none"

[widget.bluetooth.actions]
middle = "none"

[widget.brightness.actions]
middle = "none"

[widget.clock]
anchor = true
font_weight = 700
format = "{:%H:%M:%S}"
interactive = false

[widget.control-center]
glyph = "power"

[widget.date]
format = "- {:%x}"
interactive = false

[widget.input_volume.actions]
middle = "none"

[widget.network]
show_label = false

    [widget.network.actions]
    middle = "none"
    right = "none"

[widget.notifications.actions]
middle = "none"
right = "none"

[widget.output_volume.actions]
middle = "none"

[widget.workspaces]
hide_when_empty = true

    [widget.workspaces.actions]
    middle = "none"
